<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
</head>

<body>

    <main class="calculator">

        <!-- Display -->
        <section class="display">
            <div id="expression" class="expression"></div>
            <div id="display" class="display-value">0</div>
        </section>

        <!-- Keypad -->
        <section class="keypad">

            <button type="button" class="key function" data-action="clear">
                AC
            </button>

            <button type="button" class="key function" data-action="backspace">
                ⌫
            </button>

            <button type="button" class="key function" data-action="percent">
                %
            </button>

            <button type="button" class="key operator" data-operation="divide">
                ÷
            </button>

            <button type="button" class="key number" data-number="7">
                7
            </button>

            <button type="button" class="key number" data-number="8">
                8
            </button>

            <button type="button" class="key number" data-number="9">
                9
            </button>

            <button type="button" class="key operator" data-operation="multiply">
                ×
            </button>

            <button type="button" class="key number" data-number="4">
                4
            </button>

            <button type="button" class="key number" data-number="5">
                5
            </button>

            <button type="button" class="key number" data-number="6">
                6
            </button>

            <button type="button" class="key operator" data-operation="subtract">
                −
            </button>

            <button type="button" class="key number" data-number="1">
                1
            </button>

            <button type="button" class="key number" data-number="2">
                2
            </button>

            <button type="button" class="key number" data-number="3">
                3
            </button>

            <button type="button" class="key operator" data-operation="add">
                +
            </button>

            <button type="button" class="key number zero" data-number="0">
                0
            </button>

            <button type="button" class="key number" data-number=".">
                .
            </button>

            <button type="button" class="key equals" data-action="calculate">
                =
            </button>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/calculator.js') }}"></script>

</body>

</html>
