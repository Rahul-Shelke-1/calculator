name: Continuous Integration

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: latest

      - name: Setup Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --dev --python ${{ matrix.python-version }}

      - name: Run Unit Tests
        run: uv run pytest test/unit

      - name: Run Integration Tests
        run: uv run pytest test/integration

  docker:
    name: Docker Environment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build Test Docker Image
        run: docker build -t calculator-api .

      - name: Run Temporary Docker Container
        run: docker run -d --name calculator-api -p 8080:8080 calculator-api

      - name: Check Container Service
        run: docker ps -a
        
      - name: Inspect Container
        run: |
          docker inspect calculator-api
          docker logs calculator-api

      - name: Execute API Smoke Test
        run: curl --fail --retry 10 --retry-delay 2 http://localhost:8080/

      - name: Stop Docker Container
        if: always()
        run: docker rm -f calculator-api