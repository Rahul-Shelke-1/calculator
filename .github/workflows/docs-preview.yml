name: Test and Preview Build Docs

on:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'src/calculator/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/docs-preview.yml'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Test MkDocs Strict Build
        run: |
          # The --strict flag treats warnings (like broken internal links) as errors
          uv run mkdocs build --strict

      - name: Upload HTML Preview Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html-preview
          path: site/ # The folder generated by mkdocs build

      - name: Publish Preview to Cloudflare Pages
        id: cloudflare_deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'calculator-docs-preview'
          directory: 'site' # Deploy the folder generated by mkdocs build

      - name: Comment PR with Preview URL
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### 🚀 Documentation Preview Deployed!
            
            | Environment | Link |
            | :--- | :--- |
            | **Cloudflare Pages** | [View Preview](${{ steps.cloudflare_deploy.outputs.url }}) |
            
            _Built from commit ${{ github.event.pull_request.head.sha }}._