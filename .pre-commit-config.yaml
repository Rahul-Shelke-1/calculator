# To install hooks: pre-commit install
# To run manually across all files: pre-commit run --all-files

repos:
  # ---------------------------------------------------------------------------
  # General / Repository Hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=10240'] # Warns on files > 10MB
      - id: check-merge-conflict

  # ---------------------------------------------------------------------------
  # Secret Detection (Applies to both Python & Terraform)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # Note: Requires generating .secrets.baseline first (uv run detect-secrets scan > .secrets.baseline)
        args: ['--baseline', '.secrets.baseline']
        exclude: package-lock\.json|uv\.lock|\.terraform/

  # ---------------------------------------------------------------------------
  # Python Hooks (Application Code)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      # Ruff Linter (Replaces flake8, isort)
      - id: ruff
        args: [--fix]
      # Ruff Formatter (Replaces black)
      - id: ruff-format

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.366
    hooks:
      # Static Type Checker for Python
      - id: pyright

  # ---------------------------------------------------------------------------
  # Terraform Hooks (Infrastructure Code)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.91.0
    hooks:
      # Formats terraform code (.tf files)
      - id: terraform_fmt

      # Validates terraform configuration files
      - id: terraform_validate

      # Generates documentation from Terraform modules into README.md
      - id: terraform_docs
        args:
          - '--args=--lockfile=false'

      # Static security analysis for Terraform code (Checkov)
      - id: terraform_checkov
        args:
          - '--args=--quiet'
          - '--args=--compact'
